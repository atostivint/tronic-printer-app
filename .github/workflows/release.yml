name: Release

# Push a tag like v0.2.0 and a GitHub Release appears with the installer and a zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Baked into the app so it knows where to look for updates.
      TRONIC_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "Tag v$tag does not match Cargo.toml version $cargo" }

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Version
        id: v
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$cargo" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\tronic-printer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip the programs
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\tronic-printer.exe, target\release\tronic-print.exe, target\release\tronic-mcp.exe -DestinationPath TronicPrinter-${{ steps.v.outputs.version }}-portable.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/TronicPrinter-Setup-${{ steps.v.outputs.version }}.exe
            TronicPrinter-${{ steps.v.outputs.version }}-portable.zip

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            installer/Output/*.exe
            *.zip
