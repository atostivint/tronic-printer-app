<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290">
  <!-- The Tronic pocket printer: a soft white cube. The paper leaves a slit across the top seam.
       The app lays live parts on top of this picture at fixed spots, so keep these numbers:
       slit x 64..536, y 78..86 (front lip at y 86); status lamp socket at (274, 196) 52x20. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f7f7f5"/>
      <stop offset="0.75" stop-color="#e6e6e3"/>
      <stop offset="1" stop-color="#c8c8c4"/>
    </linearGradient>
    <linearGradient id="sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.12" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ee"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdb9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="shell"><path d="M100 36 C160 14,440 14,500 36 C562 58,576 112,574 168 C572 236,540 262,460 266 L140 266 C60 262,28 236,26 168 C24 112,38 58,100 36Z"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="300" cy="272" rx="270" ry="15" fill="url(#shadow)"/>

  <!-- body -->
  <g clip-path="url(#shell)">
    <rect width="600" height="290" fill="url(#body)"/>
    <rect width="600" height="290" fill="url(#sides)"/>
    <!-- light bouncing up from the desk -->
    <ellipse cx="300" cy="262" rx="230" ry="26" fill="#fff" opacity="0.45"/>
    <ellipse cx="300" cy="250" rx="200" ry="10" fill="#000" opacity="0.06"/>
  </g>
  <path d="M100 36 C160 14,440 14,500 36 C562 58,576 112,574 168 C572 236,540 262,460 266 L140 266 C60 262,28 236,26 168 C24 112,38 58,100 36Z" fill="none" stroke="#000" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- top face -->
  <path d="M104 40 C164 20,436 20,496 40 C546 58,562 92,552 120 C500 138,100 138,48 120 C38 92,54 58,104 40Z" fill="url(#top)"/>
  <ellipse cx="200" cy="58" rx="160" ry="26" fill="url(#spec)" opacity="0.8"/>
  <!-- the crease where the top rolls into the front -->
  <path d="M48 121 C100 139,500 139,552 121" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.85"/>
  <path d="M48 122.5 C100 140.5,500 140.5,552 122.5" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="2"/>

  <!-- the seam between lid and base, with a small hinge tab at each end -->
  <path d="M44 82 H556" stroke="#cfcfcb" stroke-width="1.5"/>
  <rect x="30" y="75" width="16" height="14" rx="4" fill="#f4f4f2" stroke="#000" stroke-opacity="0.12"/>
  <rect x="554" y="75" width="16" height="14" rx="4" fill="#f4f4f2" stroke="#000" stroke-opacity="0.12"/>

  <!-- the paper slit -->
  <rect x="64" y="78" width="472" height="8" rx="4" fill="#0b0b10"/>
  <rect x="64" y="78" width="472" height="3" rx="1.5" fill="#000" opacity="0.4"/>
  <path d="M66 87.5 H534" stroke="#fff" stroke-width="1" opacity="0.9"/>

  <!-- a small mark on the back half of the top: the brand, as a row of bars (no fonts in the picture) -->
  <g fill="#d0d0cc" transform="translate(300 52) scale(1 0.5) rotate(180)">
    <rect x="-44" y="-8" width="10" height="3" rx="1"/><rect x="-41" y="-8" width="3" height="16" rx="1"/>
    <rect x="-28" y="-8" width="3" height="16" rx="1"/><rect x="-28" y="-8" width="10" height="3" rx="1"/>
    <rect x="-12" y="-8" width="10" height="3" rx="1"/><rect x="-12" y="-8" width="3" height="16" rx="1"/><rect x="-12" y="5" width="10" height="3" rx="1"/>
    <rect x="4" y="-8" width="3" height="16" rx="1"/><rect x="4" y="-8" width="10" height="3" rx="1"/><rect x="11" y="-8" width="3" height="9" rx="1"/>
    <rect x="22" y="-8" width="10" height="3" rx="1"/><rect x="22" y="-8" width="3" height="16" rx="1"/><rect x="22" y="5" width="10" height="3" rx="1"/><rect x="29" y="-8" width="3" height="16" rx="1"/>
  </g>

  <!-- the status lamp's socket, low on the front -->
  <rect x="274" y="196" width="52" height="20" rx="10" fill="#000" opacity="0.12" transform="translate(0 1.5)"/>
  <rect x="274" y="196" width="52" height="20" rx="10" fill="url(#socket)"/>
  <rect x="278" y="200" width="44" height="12" rx="6" fill="#1d2a24"/>

  <!-- USB-C on the right flank -->
  <g transform="translate(540 192) rotate(-12)">
    <rect x="-12" y="-4.5" width="24" height="9" rx="4.5" fill="#2b2b31"/>
    <rect x="-7" y="-1" width="14" height="2" rx="1" fill="#6a6a72"/>
  </g>
</svg>
