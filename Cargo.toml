[package]
name = "tronic-printer"
version = "1.2.0"
edition = "2024"
default-run = "tronic-printer"
license = "MIT"
description = "Desktop app (Windows, Linux, macOS) for the Lidl Tronic / Silvercrest 5890 \"Mini Pocket Printer\" (BLE), built with Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
btleplug = "0.11"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
futures = "0.3"
uuid = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
fontdue = "0.9"
# User themes can generate their steps with a sandboxed script (no IO, deterministic), evaluated at load time.
rhai = { version = "1", features = ["serde"] }
serde_json = "1"
qrcode = "0.14.1"
barcoders = "2.0.0"
ureq = "2"

# wgpu backends follow the ones Rune itself enables on each platform.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

[target.'cfg(not(any(windows, target_vendor = "apple")))'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"


[profile.release]
lto = "thin"
